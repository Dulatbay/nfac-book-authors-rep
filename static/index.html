<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books & Authors</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>📚 Books & Authors</h1>
    <div id="user-box"></div>
  </header>

  <main>
    <section id="auth" class="card">
      <div class="tabs">
        <button data-tab="login" class="active">Вход</button>
        <button data-tab="register">Регистрация</button>
      </div>
      <form id="login-form">
        <input name="username" placeholder="Логин" required minlength="3">
        <input name="password" type="password" placeholder="Пароль" required minlength="6">
        <button type="submit">Войти</button>
      </form>
      <form id="register-form" hidden>
        <input name="first_name" placeholder="Имя" required>
        <input name="last_name" placeholder="Фамилия" required>
        <input name="username" placeholder="Логин" required minlength="3">
        <input name="password" type="password" placeholder="Пароль (мин. 6)" required minlength="6">
        <input name="image_url" type="url" placeholder="Ссылка на фото (необязательно)">
        <button type="submit">Зарегистрироваться</button>
      </form>
    </section>

    <section id="new-book" class="card" hidden>
      <h2>Добавить книгу</h2>
      <form id="book-form">
        <input name="title" placeholder="Название" required>
        <textarea name="description" placeholder="Описание"></textarea>
        <input name="file_url" type="url" placeholder="Ссылка на файл (PDF/DOCX)" required>
        <button type="submit">Опубликовать</button>
      </form>
    </section>

    <section class="card">
      <div class="row">
        <h2>Книги</h2>
        <input id="search" placeholder="Поиск…">
      </div>
      <div id="books" class="grid"></div>
    </section>

    <section class="card">
      <h2>Авторы</h2>
      <div id="authors" class="grid"></div>
    </section>
  </main>

  <div id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
